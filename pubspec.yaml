name: calda_bug_sdk
description: In-app bug reporting SDK with logs/errors/network + screenshot bundle.
version: 0.1.0
environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  http: ^1.2.0
  meta: ^1.11.0
  device_info_plus: ^11.1.0
  package_info_plus: ^8.0.0
  screen_record_plus: ^1.1.0
  supabase_flutter: ^2.8.0
  flutter_markdown: ^0.7.6
  url_launcher: ^6.2.0

flutter:
  assets:
    - assets/calda_bug_logo.png
    - assets/login-page.png

dev_dependencies:
  flutter_test:
    sdk: flutter